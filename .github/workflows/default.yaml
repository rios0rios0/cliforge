name: 'default'

on:
  push:
    branches:
      - 'main'
    tags:
      - '*'
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:

permissions:
  checks: 'write' # code_check-style_golangci_lint
  security-events: 'write' # security-sast_codeql
  contents: 'write' # delivery-release

jobs:
  # The shared pipeline runs every job on Linux and only type-checks the Windows build, yet
  # self-update renames and replaces a running binary, which is exactly where Windows behaves
  # differently. The Windows run is an input of the pipeline rather than a job of its own here, so
  # it runs in the tests stage, after the security stage and before delivery: a job beside the call
  # can only wait for the whole called workflow, so it used to start at once, beside the first
  # stage. `test:all` on Linux still owns coverage and the published reports.
  default:
    uses: 'rios0rios0/pipelines/.github/workflows/go-library.yaml@main'
    with:
      extra_test_name: 'windows'
      extra_test_command: 'go test -count=1 ./...'
      extra_test_runs_on: '["windows-latest"]'
